[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-company"
version = "0.1.0"
description = "Local-first AI content production control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "SQLAlchemy>=2,<3",
  "itsdangerous>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
media = ["imageio-ffmpeg>=0.6,<1", "Pillow>=11,<13"]
standard = [
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "dramatiq[rabbitmq]>=1.17,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_company.api" = ["dashboard.html", "login.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
